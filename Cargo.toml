[workspace]
members = [".", "crates/pqc_crypto_module", "tools/acvp_dry_run", "tauri-app"]
exclude = ["crates/pqc_crypto_module/fuzz"]

[package]
name = "rust-bc"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
pqc_crypto_module = { path = "crates/pqc_crypto_module" }
lazy_static = "1.4"
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
urlencoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
actix-web = { version = "4.5", features = ["rustls-0_23"] }
actix-tls = { version = "3.5", features = ["rustls-0_23"] }
actix-cors = "0.7"
actix-rt = "2.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.8"
# `rustls-tls` would enable reqwest's own ring-backed provider, which collides
# with the aws-lc-rs provider this crate installs in tls::install_crypto_provider()
# — with both enabled, rustls 0.23 refuses to pick one and panics. The
# `-no-provider` variant leaves that choice to us.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-webpki-roots-no-provider"] }
log = "0.4"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi"] }
thiserror = "1.0"
dirs = "6"
time = { version = "0.3", features = ["std"] }
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"
x509-parser = "0.16"
async-trait = "0.1"
futures = "0.3"
prometheus = { version = "0.13", features = ["process"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
actix-ws = "0.3"
cryptoki = { version = "0.7", optional = true }
pqcrypto-mldsa = "0.1.2"
pqcrypto-traits = "0.3"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
rsa = "0.9"
ciborium = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
flate2 = "1.0"
lopdf = "0.34"
rustls-post-quantum = "0.2"

# Heavy optional dependencies (feature-gated)
rocksdb = { version = "0.22", optional = true }
wasmtime = { version = "36", optional = true }
wasmparser = "0.236"
wat = "1.246"
raft = { version = "0.7", default-features = false, features = ["default-logger", "prost-codec"], optional = true }
prost = { version = "0.11", optional = true }
revm = { version = "38", optional = true }
alloy-primitives = { version = "1", optional = true }

[features]
default = ["full"]
full = ["rocksdb-storage", "evm", "wasm-chaincode", "raft-ordering"]
rocksdb-storage = ["rocksdb"]
evm = ["revm", "alloy-primitives"]
wasm-chaincode = ["wasmtime"]
raft-ordering = ["raft", "prost"]
hsm = ["cryptoki"]

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "ordering_throughput"
harness = false

[[bench]]
name = "pqc_performance"
harness = false

[[bin]]
name = "cerulean"
path = "src/bin/cerulean.rs"

[[bin]]
name = "goya-sign"
path = "src/bin/goya_sign.rs"

[[bin]]
name = "pairwise-subjects"
path = "src/bin/pairwise_subjects.rs"
